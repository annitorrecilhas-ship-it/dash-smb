<main>
  <style>
    .tabs-bar{display:flex;justify-content:center;margin:0 0 18px}
    .tabs-bar .view-toggle button{font-size:13px;padding:8px 18px}
    .fora-filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
    .fora-filtros input{flex:1;min-width:180px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
    .fora-cards{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
    .fora-cards div{padding:16px 20px;border-right:1px solid var(--border)}
    .fora-cards div:last-child{border-right:none}
    .fora-cards b{display:block;font-size:26px;color:var(--cobli-indigo)}
    .fora-cards span{font-size:12px;color:var(--ink-soft)}
    .fora-wrap{overflow-x:auto}
    table.fora{width:100%;border-collapse:collapse;font-size:12.5px}
    table.fora th{position:sticky;top:0;background:#F0F2FA;text-align:left;padding:9px 10px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
    table.fora td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
    table.fora td.n{text-align:right;white-space:nowrap}
    table.fora a{color:var(--cobli-indigo);font-weight:700;text-decoration:none}
    .mot{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
    .mot-A{background:#FFF1E0;color:#A35200}.mot-E{background:#FDE7E7;color:#B42318}.mot-N{background:#EEF0FB;color:#3B3F8F}.mot-O{background:#F0F2F5;color:#55597A}
    @media (max-width:800px){.fora-cards{grid-template-columns:1fr 1fr}.fora-cards div:nth-child(2){border-right:none}}
  </style>
  <div class="tabs-bar"><div class="view-toggle" id="tabs-toggle">
    <button type="button" class="active" data-view="geral">Visão geral</button>
    <button type="button" data-view="fora">Casos fora do SLA <span id="lbl-fora-total"></span></button>
  </div></div>
  <div id="tab-geral">

  <section class="block highlight">
    <div class="block-title"><span class="dot"></span>SLA Agendamento — seu destaque<span class="tag">Seu desempenho</span></div>
    <div class="split-2">
      <div class="dash-card">
        <div class="dash-card-title">% dentro do prazo — mensal (desde <span id="lbl-first-month"></span>)</div>
        <div class="dash-canvas-wrap"><canvas id="c-own-mensal"></canvas></div>
      </div>
      <div class="dash-card">
        <div class="dash-card-title">% dentro do prazo — últimas 3 semanas</div>
        <div class="dash-canvas-wrap"><canvas id="c-own-semanal"></canvas></div>
      </div>
    </div>
    <div class="dash-card" style="border-top: 1px solid var(--border);">
      <div class="dash-card-title with-toggle">
        <span>Tickets que passaram pela etapa — <span id="vol-period-label-1">últimos 15 dias úteis</span></span>
        <div class="view-toggle" id="vol-toggle">
          <button type="button" class="active" data-view="diario">Diário</button>
          <button type="button" data-view="mensal">Mensal</button>
        </div>
      </div>
      <div class="dash-canvas-wrap"><canvas id="c-own-diario"></canvas></div>
    </div>
    <div class="dash-card" style="border-top: 1px solid var(--border);">
      <div class="block-note" style="padding:0;" id="note-prestador"></div>
    </div>
  </section>

{{VISAO_GERAL}}
  </div>
  <div id="tab-fora" hidden>
  <section class="block">
    <div class="block-title"><span class="dot"></span>Casos fora do SLA<span class="tag pend" id="lbl-fora-periodo"></span></div>
    <div class="fora-filtros">
      <div class="view-toggle" id="fora-mes-toggle"></div>
      <div class="view-toggle" id="fora-mot-toggle">
        <button type="button" class="active" data-view="T">Todos</button>
        <button type="button" data-view="A">Saiu com atraso</button>
        <button type="button" data-view="E">Ainda na etapa</button>
        <button type="button" data-view="N">No-show</button>
      </div>
      <input type="search" id="fora-busca" placeholder="Buscar cliente, ticket ou cidade">
    </div>
    <div class="fora-cards" id="fora-cards"></div>
    <div class="fora-wrap"><table class="fora"><thead><tr>
      <th>Ticket</th><th>Cliente</th><th>Pipeline</th><th>Cidade</th><th>Entrou na etapa</th><th>Prazo</th><th>Saiu da etapa</th><th>Dias úteis</th><th>Motivo</th><th>Status atual</th>
    </tr></thead><tbody id="fora-tbody"></tbody></table></div>
    <div class="dash-card" style="border-top: 1px solid var(--border);">
      <div class="block-note" style="padding:0;" id="note-fora"></div>
    </div>
  </section>
  </div>
</main>
